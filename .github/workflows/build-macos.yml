name: Build macOS DMG

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish GitStat.dmg
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build GitStat.app
        run: |
          set -euo pipefail

          xcodebuild \
            -project GitStat.xcodeproj \
            -scheme GitStat \
            -configuration Release \
            -derivedDataPath build-output \
            -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package DMG
        run: |
          set -euo pipefail

          APP_PATH="build-output/Build/Products/Release/GitStat.app"
          DMG_ROOT="dist/dmg-root"

          test -d "$APP_PATH"

          rm -rf dist
          mkdir -p "$DMG_ROOT"
          ditto "$APP_PATH" "$DMG_ROOT/GitStat.app"

          codesign \
            --force \
            --deep \
            --sign - \
            --entitlements Resources/GitStat.entitlements \
            "$DMG_ROOT/GitStat.app"

          codesign --verify --deep --strict --verbose=2 "$DMG_ROOT/GitStat.app"

          hdiutil create \
            -volname "GitStat" \
            -srcfolder "$DMG_ROOT" \
            -ov \
            -format UDZO \
            dist/GitStat.dmg

          shasum -a 256 dist/GitStat.dmg > dist/GitStat.dmg.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitStat.dmg
          path: |
            dist/GitStat.dmg
            dist/GitStat.dmg.sha256
          if-no-files-found: error

      - name: Publish latest release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="latest"
          TITLE="Latest GitStat build"
          NOTES="Automated macOS DMG build from ${GITHUB_SHA}."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest
          fi

          gh release upload "$TAG" \
            dist/GitStat.dmg \
            dist/GitStat.dmg.sha256 \
            --clobber
